name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      # Trợ lý AI: chấm câu trả lời trên dòng họ mẫu (DB giả, không gọi Groq). Nâng --min sau mỗi đợt sửa.
      - run: node scripts/chatbot-e2e-check.js --min 199 --min-conversation 7
      # Tiếng Việt có dấu: cặp chỉ khác dấu, tên trùng khi bỏ dấu, dấu rời, sai thanh, sót dấu, không dấu mơ hồ, quyền hạn.
      - run: >-
          node scripts/chatbot-e2e-check.js --suite accent --min 96
          --min-group "Cặp chỉ khác dấu=20" --min-group "Tên trùng khi bỏ dấu=15"
          --min-group "Dấu rời và kiểu đặt dấu=10" --min-group "Không dấu mơ hồ=15" --min-group "Quyền hạn=6"
      # L6: cùng hai bộ đo với parser quan hệ đọc chữ có dấu (CHATBOT_ACCENT_FIRST=1). Chỉ in số, chưa chặn,
      # cho tới khi danh sách khác biệt (scripts/chatbot-parser-diff.js) được duyệt và cờ bật mặc định (L14).
      - name: Bộ đo với CHATBOT_ACCENT_FIRST=1 (chưa chặn)
        continue-on-error: true
        env:
          CHATBOT_ACCENT_FIRST: '1'
        run: |
          node scripts/chatbot-e2e-check.js --min 199 --min-conversation 7
          node scripts/chatbot-e2e-check.js --suite accent --min 109 --min-group "Chuỗi quan hệ=13"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # S4: bộ thử trình duyệt (Playwright) cho 5 luồng chính trên MySQL trong container của Actions.
  # Không dùng TiDB thật, không cần secret: DB dựng bằng npm run migrate, dữ liệu bằng scripts/e2e-seed.js, LLM giả (e2e/fake-llm.mjs).
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: cap2_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_root
      DB_NAME: cap2_ci
      DB_SSL: 'false'
      JWT_SECRET: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: Backend
      - run: npm ci
        working-directory: Frontend
      - run: npm ci
        working-directory: e2e
      - name: Dựng schema (database/schema + migrations + ensure)
        run: npm run migrate
        working-directory: Backend
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
